<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
}
a {
  text-decoration: none;
  color: inherit;
}
a:hover {
  color: #fdf800;
}
body {
  font-family: Arial, Helvetica, sans-serif;
  background-color: #212121;
  color: white;
}

/* Float four columns side by side */
.column {
  margin: auto;
  width: 80%;
  margin-bottom: 2vw;
}

/* Remove extra left and right margins, due to padding */
/*.row {margin: 0 -5px;}*/

/* Clear floats after the columns */
/*
.row:after {
  content: "";
  display: table;
  clear: both;
}
*/
/* Responsive columns */

/* Style the counter cards */
.card {
  height: 10vw;
  position: relative;
  box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
  padding: 16px;
  text-align: center;
  background-color: black;
}
.card:hover {
  top: -10px;
  right: -10px;
}
.text {
  text-align: center;
}
</style>
</head>
<body>
<div class="text">
<h2>RM Notes</h2>
<p>Newly released note taking app for RM students</p>
</div>
<div class="row">
  <div class="column">
    <a href="/file?name=note1.txt">
    <div class="card">
      <h3>Physics Notes</h3>
    </div>
    </a>
  </div>

  <div class="column">
    <a href="/file?name=note2.txt">
    <div class="card">
      <h3>Calculus notes</h3>
    </div>
    </a>
  </div>
  
  <div class="column">
    <a href="/file?name=note3.txt">
    <div class="card">
      <h3>Chemistry notes</h3>
    </div>
    </a>
  </div>
  
  <div class="column">
    <a href="/file?name=note4.txt">
    <div class="card">
      <h3>World History notes</h3>
    </div>
    </a>
  </div>
</div>

</body>
</html>

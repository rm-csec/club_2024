<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
  box-sizing: border-box;
}
a {
  text-decoration: none;
  color: inherit;
}
a:hover {
  color: #fdf800;
}
h2{
  color: #fdf800;
}
body {
  font-family: Arial, Helvetica, sans-serif;
  background-color: #212121;
  color: white;
}

.column1 {
  width: 50%;
  margin: auto;
}
.column2 {
  width: 50%;
  margin: auto;
}
.card1 {
  display: inline-block;
  align-content: center;
  margin: 1% 5% 1% 5%;
  width: 30%;
  height: 30vw;
  position: relative;
  box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
  padding: 16px;
  text-align: center;
  background-color: black;
}
.card2 {
  display: inline-block;
  float: right;
  align-content: center;
  margin: 1% 5% 1% 5%;
  width: 30%;
  height: 30vw;
  position: relative;
  box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
  padding: 16px;
  text-align: center;
  background-color: black;
}
.card3 {
  display: inline-block;
  align-content: center;
  margin: 1% 5% 1% 5%;
  width: 30%;
  height: 30vw;
  position: relative;
  box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
  padding: 16px;
  text-align: center;
  background-color: black;
}
.card4 {
  display: inline-block;
  float: right;
  align-content: center;
  margin: 1% 5% 1% 5%;
  width: 30%;
  height: 30vw;
  position: relative;
  box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
  padding: 16px;
  text-align: center;
  background-color: black;
}
.card:hover {
  top: -10px;
  right: -10px;
}
.text {
  text-align: center;
}
</style>
</head>
<body>
<div class="text">
<h2>RM Photos</h2>
<p>From the creators of RM Notes</p>
</div>
<div class="row">
  <div class="column1">
    <a href="/file?name=image1.jpg">
    <div class="card1">
      <h3>Image 1</h3>
    </div>
    </a>

    <a href="/file?name=image2.jpg">
    <div class="card2">
      <h3>Image 2</h3>
    </div>
    </a>
  </div>
  
  <div class="column2">
    <a href="/file?name=image3.jpg">
    <div class="card3">
      <h3>Image 3</h3>
    </div>
    </a>
  
    <a href="/file?name=image4.jpg">
    <div class="card4">
      <h3>Image 4</h3>
    </div>
    </a>
  </div>
</div>

</body>
</html>
